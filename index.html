<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra chứng chỉ</title>
</head>
<body>
    <h2>Kiểm tra chứng chỉ</h2>
    <form id="certForm" enctype="multipart/form-data">
        <input type="file" name="file" accept=".zip" required>
        <input type="text" name="password" placeholder="Nhập mật khẩu chứng chỉ" required>
        <button type="submit">Kiểm tra</button>
    </form>
    <div id="result"></div>
    <script>
    document.getElementById('certForm').onsubmit = async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        document.getElementById('result').innerText = "Đang kiểm tra...";
        let response = await fetch('http://YOUR_VPS_IP:5000/api/check-cert', {
            method: 'POST',
            body: formData
        });
        let data = await response.json();
        if (data.error) {
            document.getElementById('result').innerText = "Lỗi: " + data.error;
        } else {
            document.getElementById('result').innerText = JSON.stringify(data.cert_info, null, 2);
        }
    }
    </script>
</body>
</html>
