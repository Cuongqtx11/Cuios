<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12 Check Real</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
  label { display:block; margin-top:10px; }
  input, button { width:100%; padding:8px; margin-top:5px; }
  button { background:#007bff; color:#fff; border:none; cursor:pointer; }
  button:hover { background:#0056b3; }
  .ok { background:#c8f7c5; padding:10px; border-radius:6px; }
  .revoked { background:#f9c0c0; padding:10px; border-radius:6px; }
</style>
</head>
<body>
  <h1>Kiểm tra P12 (ZIP)</h1>
  <form id="form">
    <label>Chọn file ZIP</label>
    <input type="file" name="ZipFile" id="zip" accept=".zip" required>

    <label>Mật khẩu P12</label>
    <input type="text" name="P12PassWordZip" id="pass" placeholder="Nhập mật khẩu">

    <button type="submit">Kiểm tra</button>
  </form>

  <div id="result" style="margin-top:20px;"></div>

  <script src="./frontend.js"></script>
</body>
</html>
