<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra chứng chỉ – P12.vn</title>
<style>
body { font-family: sans-serif; background: #fafafa; text-align: center; margin-top: 60px; }
input, button { padding: 10px; margin: 5px; font-size: 16px; }
#result { margin-top: 20px; white-space: pre-line; text-align: left; display: inline-block; }
</style>
</head>
<body>
<h2>🔍 Kiểm tra chứng chỉ UDID</h2>
<input id="udid" placeholder="Nhập UDID..." size="40">
<button onclick="checkUDID()">Kiểm tra</button>
<div id="result"></div>

<script>
const API_BASE = "https://bot.p12.vn:5050";

async function checkUDID(){
  const udid = document.getElementById("udid").value.trim();
  if(!udid){ alert("Vui lòng nhập UDID"); return; }

  document.getElementById("result").innerText = "⏳ Đang kiểm tra...";
  try{
    const res = await fetch(`${API_BASE}/check_udid`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({udid})
    });
    const data = await res.json();
    if(data.error){ document.getElementById("result").innerText = "❌ " + data.error; return; }
    document.getElementById("result").innerText =
      `📝 Thông tin đơn hàng:\n\n` +
      `🔎 PIN: ${data.pin}\n` +
      `📱 UDID: ${data.udid}\n` +
      `⏰ Thời hạn: ${data.remain_time}\n` +
      `📆 Ngày mua: ${data.ngay_mua}\n` +
      `📆 Bảo hành đến: ${data.bao_hanh}\n` +
      `📌 Trạng thái: ${data.trang_thai}`;
  }catch(e){
    document.getElementById("result").innerText = "❌ Lỗi khi kết nối server.";
  }
}
</script>
</body>
</html>
