<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra chứng chỉ Apple P12</title>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    width: 90%;
    max-width: 400px;
    background: #161b22;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px #0006;
  }
  h1 { text-align: center; font-size: 18px; margin-bottom: 15px; }
  input, button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    margin-top: 10px;
    font-size: 15px;
  }
  input[type="file"], input[type="text"] {
    background: #21262d;
    color: #c9d1d9;
  }
  button {
    background: #238636;
    color: white;
    cursor: pointer;
    font-weight: bold;
  }
  .drop-zone {
    background: #1c2128;
    border: 2px dashed #30363d;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    color: #888;
    margin-bottom: 10px;
  }
  .drop-zone.dragover {
    border-color: #238636;
    color: #238636;
  }
  .result {
    background: #161b22;
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
  }
  .status {
    padding: 3px 8px;
    border-radius: 4px;
    color: #fff;
    font-weight: bold;
  }
  .status.active { background: #238636; }
  .status.revoked { background: #da3633; }
  .actions {
    text-align: center;
    margin-top: 20px;
  }
  .actions a {
    color: white;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 6px;
    margin: 5px;
    display: inline-block;
  }
  .actions .buy { background: #238636; }
  .actions .back { background: #30363d; }
</style>
</head>
<body>
  <div class="container" id="main">
    <h1>Kiểm tra chứng chỉ Apple P12</h1>
    <form id="form">
      <div class="drop-zone" id="dropZone">Kéo & thả file .zip vào đây</div>

      <!-- 👇 Thêm nút chọn file riêng -->
      <input type="file" id="zip" name="ZipFile" accept=".zip">
      <input type="text" id="pass" name="P12PassWordZip" placeholder="Nhập mật khẩu (nếu có)">
      <button type="submit">Kiểm tra</button>
    </form>
    <div id="result" class="result" style="display:none;"></div>
    <div id="actions" class="actions" style="display:none;">
      <a href="#" class="back" id="backBtn">Quay lại</a>
      <a href="https://cuios.shop" target="_blank" class="buy">Buy Cert</a>
    </div>
  </div>

<script>
const dz = document.getElementById('dropZone');
const fileInput = document.getElementById('zip');

// Kéo & thả file
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  fileInput.files = e.dataTransfer.files;
  dz.textContent = fileInput.files[0]?.name || 'File không hợp lệ';
});

// Giao diện chọn file
fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    dz.textContent = fileInput.files[0].name;
  } else {
    dz.textContent = 'Kéo & thả file .zip vào đây';
  }
});

// Gửi yêu cầu
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) return alert('Vui lòng chọn file .zip');
  const pass = document.getElementById('pass').value;
  const formData = new FormData();
  formData.append('ZipFile', file);
  formData.append('P12PassWordZip', pass);

  const resEl = document.getElementById('result');
  resEl.style.display = 'block';
  resEl.innerHTML = '⏳ Đang kiểm tra...';

  const resp = await fetch('/api/check', { method: 'POST', body: formData });
  const data = await resp.json();
  if (!data.ok) {
    resEl.innerHTML = '❌ Lỗi: ' + (data.error || 'Không xác định');
    return;
  }

  let daysLeft = '-';
  if (data.expirationDate) {
    const diff = (new Date(data.expirationDate) - new Date()) / (1000 * 3600 * 24);
    daysLeft = Math.max(0, Math.floor(diff));
  }

  let statusClass = 'active', msg = '';
  if (data.status.includes('thu hồi')) {
    statusClass = 'revoked';
    msg = '🔴 Chứng chỉ bị thu hồi. UDID có thể bị blacklist.';
  } else if (data.status.includes('hết hạn')) {
    statusClass = 'revoked';
    msg = '⚠️ Chứng chỉ đã hết hạn. Vui lòng mua mới.';
  } else {
    msg = '🟢 Chứng chỉ đang hoạt động bình thường.';
  }

  resEl.innerHTML = `
    <p><b>Tên chứng chỉ:</b> ${data.certName || '-'}</p>
    <p><b>Ngày hết hạn:</b> ${data.expirationDate || '-'}</p>
    <p><b>Trạng thái:</b> <span class="status ${statusClass}">${data.status}</span></p>
    <p><b>Còn lại:</b> ${daysLeft} ngày</p>
    <p><b>Loại:</b> Distribution có hỗ trợ App Group</p>
    <hr><p>${msg}</p>
  `;
  document.getElementById('form').style.display = 'none';
  document.getElementById('actions').style.display = 'block';
});

// Nút quay lại
document.getElementById('backBtn').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('form').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  document.getElementById('actions').style.display = 'none';
  document.getElementById('result').innerHTML = '';
  dz.textContent = 'Kéo & thả file .zip vào đây';
  fileInput.value = '';
});
</script>
</body>
</html>
