<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra chứng chỉ Apple P12</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #c9d1d9;
    --accent: #238636;
    --revoked: #da3633;
    --expired: #9e6c00;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .container {
    width: 90%; max-width: 400px;
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 20px #0004;
  }
  h1 { text-align: center; font-size: 20px; margin-bottom: 20px; }
  input, button {
    width: 100%; padding: 10px; margin-top: 10px;
    border-radius: 6px; border: none; outline: none;
    font-size: 15px;
  }
  input[type="file"], input[type="text"] {
    background: #21262d; color: var(--text);
  }
  button {
    background: var(--accent); color: white; cursor: pointer; font-weight: bold;
  }
  button:hover { opacity: 0.9; }
  .drop-zone {
    background: #1c2128;
    border: 2px dashed #30363d;
    border-radius: 10px;
    padding: 25px;
    text-align: center;
    color: #888;
    margin-bottom: 10px;
  }
  .drop-zone.dragover { border-color: var(--accent); color: var(--accent); }
  .result-card { padding: 15px; margin-top: 15px; }
  .status {
    padding: 6px 10px; border-radius: 6px; font-weight: bold; color: white;
  }
  .status.active { background: var(--accent); }
  .status.revoked { background: var(--revoked); }
  .status.expired { background: var(--expired); }
  .actions { text-align: center; margin-top: 20px; }
  .actions a {
    display: inline-block; margin: 5px; padding: 10px 15px;
    background: #30363d; color: #fff; border-radius: 6px;
    text-decoration: none;
  }
  .actions a.buy { background: var(--accent); }
</style>
</head>
<body>
<div class="container" id="main">
  <h1>Kiểm tra chứng chỉ Apple P12</h1>

  <form id="form">
    <div class="drop-zone" id="dropZone">Kéo & thả file .zip vào đây hoặc chọn tệp</div>
    <input type="file" id="zip" name="ZipFile" accept=".zip" hidden>
    <input type="text" id="pass" name="P12PassWordZip" placeholder="Nhập mật khẩu (nếu có)">
    <button type="submit">Kiểm tra</button>
  </form>

  <div id="result" class="result-card" style="display:none;"></div>

  <div class="actions" id="actions" style="display:none;">
    <a href="#" id="backBtn">Quay lại</a>
    <a href="https://cuios.shop" target="_blank" class="buy">Buy Cert</a>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('zip');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => {
  e.preventDefault(); dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  fileInput.files = e.dataTransfer.files;
  dropZone.textContent = fileInput.files[0]?.name || 'File không hợp lệ';
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) return alert('Vui lòng chọn file .zip');
  const pass = document.getElementById('pass').value;
  const formData = new FormData();
  formData.append('ZipFile', file);
  formData.append('P12PassWordZip', pass);

  const resEl = document.getElementById('result');
  resEl.style.display = 'block';
  resEl.innerHTML = '🔍 Đang kiểm tra...';

  try {
    const resp = await fetch('/api/check', { method: 'POST', body: formData });
    const data = await resp.json();

    if (!data.ok) throw new Error(data.error || 'Phân tích thất bại');

    let statusClass = 'active';
    let statusText = 'Hoạt động';
    let statusNote = '✅ Chứng chỉ của bạn đang hoạt động bình thường, không có vấn đề gì.';

    const now = new Date();
    const expDate = new Date(data.expirationDate || now);
    const remain = Math.max(0, Math.ceil((expDate - now) / (1000 * 3600 * 24)));

    if (/revok/i.test(data.status)) {
      statusClass = 'revoked';
      statusText = 'Đã thu hồi';
      statusNote = '⚠️ Chứng chỉ đã bị thu hồi. UDID có khả năng bị blacklist.';
    } else if (/expire/i.test(data.status)) {
      statusClass = 'expired';
      statusText = 'Đã hết hạn';
      statusNote = '⛔ Chứng chỉ của bạn đã hết hạn, vui lòng mua mới để sử dụng.';
    } else if (/valid|good|active/i.test(data.status)) {
      statusClass = 'active';
      statusText = 'Hoạt động';
    }

    resEl.innerHTML = `
      <p><b>Tên chứng chỉ:</b> ${data.certName || '-'}</p>
      <p><b>Ngày hết hạn:</b> ${data.expirationDate?.split(' ')[0] || '-'}</p>
      <p><b>Trạng thái:</b> <span class="status ${statusClass}">${statusText}</span></p>
      <p><b>Ngày sử dụng còn:</b> ${remain} ngày</p>
      <p><b>Loại:</b> Hỗ trợ App Group</p>
      <hr><p>${statusNote}</p>
    `;

    document.getElementById('form').style.display = 'none';
    document.getElementById('actions').style.display = 'block';
  } catch (err) {
    resEl.innerHTML = '❌ Lỗi: ' + err.message;
  }
});

document.getElementById('backBtn').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('form').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  document.getElementById('actions').style.display = 'none';
  resEl.innerHTML = '';
  dropZone.textContent = 'Kéo & thả file .zip vào đây hoặc chọn tệp';
  fileInput.value = '';
});
</script>
</body>
</html>
