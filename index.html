<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12.vn - Kiểm tra chứng chỉ</title>
<style>
body {
  background: #0b1622;
  color: #fff;
  font-family: "Segoe UI", sans-serif;
  text-align: center;
  padding: 30px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: #122233;
  border-radius: 10px;
  padding: 25px;
}
h1 {
  color: #8fbcd4;
  margin-bottom: 10px;
}
input[type=text], input[type=url] {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: none;
  border-radius: 6px;
}
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 6px;
  background: #1c87c9;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}
button:hover { background: #155d8c; }
.result {
  text-align: left;
  margin-top: 20px;
  padding: 15px;
  background: #101c2e;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.5;
}
.loader {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #1c87c9;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  animation: spin 1s linear infinite;
  margin: 10px auto;
  display: none;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
small { color: #888; font-size: 13px; }
</style>
</head>
<body>

<div class="container">
  <h1>📱 P12.vn Check</h1>
  <p>Nhập <b>UDID</b> hoặc link file .zip chứng chỉ để kiểm tra</p>

  <input type="text" id="udid" placeholder="Nhập UDID của bạn...">
  <input type="url" id="zip_url" placeholder="Hoặc dán link file .zip (nếu có)">
  <input type="text" id="password" placeholder="Mật khẩu (nếu có)">
  <button onclick="doCheck()">🔍 Kiểm tra ngay</button>
  <div class="loader" id="loader"></div>

  <div class="result" id="result"></div>

  <small>Kết quả và thông báo sẽ gửi về bot admin của bạn.</small>
</div>

<script>
const API_URL = "https://bot.p12.vn/api/check";  // giữ nguyên domain bot
async function doCheck() {
  const udid = document.getElementById("udid").value.trim();
  const zip_url = document.getElementById("zip_url").value.trim();
  const password = document.getElementById("password").value.trim();
  const loader = document.getElementById("loader");
  const result = document.getElementById("result");
  result.innerHTML = "";
  loader.style.display = "block";

  try {
    const body = {};
    if (udid) body.udid = udid;
    if (zip_url) body.zip_url = zip_url;
    if (password) body.password = password;

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    loader.style.display = "none";

    if (!data.ok) {
      result.innerHTML = `<b>❌ Lỗi:</b> ${data.error || 'Không xác định'}`;
      return;
    }

    const info = data.data;
    if (info.UDID) {
      result.innerHTML = `
        <b>🔎 PIN:</b> ${info.PIN}<br>
        <b>📱 UDID:</b> ${info.UDID}<br>
        <b>📌 Trạng thái:</b> ${info['Trạng thái']}<br>
        <b>⏰ Thời hạn:</b> ${info['Thời hạn']}<br>
        <b>📆 Ngày mua:</b> ${info['Ngày mua']}<br>
        <b>📆 Bảo hành đến:</b> ${info['Bảo hành đến ngày']}<br>
        <b>✅ Còn lại:</b> ${info.DaysLeft ?? 'N/A'} ngày<br>
        <small>${info.note || ''}</small>
      `;
    } else if (info.CertInfo) {
      result.innerHTML = `
        <b>📄 Thông tin chứng chỉ:</b><br>
        <pre>${JSON.stringify(info.CertInfo, null, 2)}</pre>
        <b>✅ Còn lại:</b> ${info.DaysLeft ?? 'N/A'} ngày
      `;
    } else {
      result.innerHTML = "<b>⚠️ Không có dữ liệu trả về.</b>";
    }
  } catch (e) {
    loader.style.display = "none";
    result.innerHTML = `<b>❌ Lỗi:</b> ${e.message}`;
  }
}
</script>

</body>
</html>
