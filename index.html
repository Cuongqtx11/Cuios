<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kiểm tra chứng chỉ Apple P12</title>
<style>
  body {
    font-family: "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #222;
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 10px;
    background-color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    color: #0070f3;
  }
  label { display: block; margin-top: 15px; font-weight: 600; }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  button {
    background: #0070f3;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #0057c2; }
  #result {
    margin-top: 25px;
    padding: 15px;
    border-radius: 8px;
  }
  .ok { background: #e7fbe7; border: 1px solid #a4dca4; }
  .revoked { background: #ffe6e6; border: 1px solid #ffb3b3; }
  .expired { background: #fff0cc; border: 1px solid #ffd966; }
  .info-box { margin-top: 15px; padding: 10px; border-radius: 6px; background: #f0f0f0; font-size: 14px; }
</style>
</head>
<body>

  <h1>Kiểm tra chứng chỉ Apple P12</h1>

  <form id="form">
    <label>Chọn file ZIP</label>
    <input type="file" name="ZipFile" id="zip" accept=".zip" required>

    <label>Mật khẩu P12 (nếu có)</label>
    <input type="text" name="P12PassWordZip" id="pass" placeholder="Nhập mật khẩu ZIP">

    <button type="submit">🔍 Kiểm tra</button>
  </form>

  <div id="result"></div>

<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const file = document.getElementById('zip').files[0];
  const pass = document.getElementById('pass').value;
  const resultBox = document.getElementById('result');
  resultBox.innerHTML = '⏳ Đang kiểm tra, vui lòng đợi...';

  const formData = new FormData();
  formData.append('ZipFile', file);
  formData.append('P12PassWordZip', pass);

  try {
    const resp = await fetch('https://api.p12.vn/api/check', {
      method: 'POST',
      body: formData,
    });

    const data = await resp.json();
    if (!data.ok) {
      resultBox.innerHTML = `<div class="revoked">❌ Lỗi: ${data.error || 'Không xác định'}</div>`;
      return;
    }

    // ---- Tính ngày còn lại ----
    let daysLeft = '-';
    if (data.expirationDate) {
      const exp = new Date(data.expirationDate);
      const now = new Date();
      const diff = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
      daysLeft = diff >= 0 ? diff : 0;
    }

    // ---- Phân loại trạng thái ----
    let statusClass = 'ok';
    let note = '';
    if (data.status?.toLowerCase().includes('revoked')) {
      statusClass = 'revoked';
      note = `⚠️ Chứng chỉ đã bị thu hồi. UDID có khả năng bị Blacklist. 
      Nếu muốn sử dụng tiếp, hãy mua gói Unband. 
      Nếu mua gói thường, có thể cần chờ 17–33 ngày để dùng lại.`;
    } else if (daysLeft === 0) {
      statusClass = 'expired';
      note = `⚠️ Chứng chỉ của bạn đã hết hạn. 
      Vui lòng mua chứng chỉ mới để tiếp tục sử dụng.`;
    } else {
      statusClass = 'ok';
      note = `✅ Chứng chỉ của bạn đang hoạt động bình thường. 
      Có thể tiếp tục ký app và sử dụng.`;
    }

    // ---- Hiển thị kết quả ----
    resultBox.innerHTML = `
      <div class="${statusClass}">
        <p><b>Tên chứng chỉ:</b> ${data.certName || '-'}</p>
        <p><b>Ngày hết hạn:</b> ${data.expirationDate || '-'}</p>
        <p><b>Trạng thái:</b> ${data.status || '-'}</p>
        <p><b>Ngày sử dụng còn:</b> ${daysLeft} ngày</p>
        <p><b>Loại:</b> Distribution có hỗ trợ App Group</p>
      </div>
      <div class="info-box">${note}</div>
    `;

  } catch (err) {
    resultBox.innerHTML = `<div class="revoked">❌ Lỗi kết nối API: ${err.message}</div>`;
  }
});
</script>

</body>
</html>
