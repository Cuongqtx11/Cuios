<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12 Check Real</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #c9d1d9;
    --accent: #238636;
    --revoked: #da3633;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .container {
    width: 90%; max-width: 400px;
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 20px #0004;
    transition: all 0.3s;
  }
  h1 { text-align: center; font-size: 20px; margin-bottom: 20px; }
  input, button {
    width: 100%; padding: 10px; margin-top: 10px;
    border-radius: 6px; border: none; outline: none;
    font-size: 15px;
  }
  input[type="file"] {
    background: #21262d;
    color: #aaa;
  }
  input[type="text"] {
    background: #21262d;
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: white; cursor: pointer; font-weight: bold;
  }
  button:hover { opacity: 0.9; }
  .drop-zone {
    background: #1c2128;
    border: 2px dashed #30363d;
    border-radius: 10px;
    padding: 25px;
    text-align: center;
    color: #888;
    margin-bottom: 10px;
  }
  .drop-zone.dragover { border-color: var(--accent); color: var(--accent); }
  .result-card {
    background: #161b22;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
  }
  .status {
    padding: 8px; border-radius: 6px;
    color: white; font-weight: bold;
    display: inline-block; margin-top: 5px;
  }
  .status.active { background: var(--accent); }
  .status.revoked { background: var(--revoked); }
  .actions { text-align: center; margin-top: 20px; }
  .actions a {
    display: inline-block; margin: 5px; padding: 10px 15px;
    background: #30363d; color: #fff; border-radius: 6px;
    text-decoration: none;
  }
  .actions a.buy { background: var(--accent); }
  p.note {
    font-size: 13px;
    background: #1f242c;
    padding: 10px;
    border-radius: 6px;
    margin-top: 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="container" id="main">
    <h1>Kiểm tra chứng chỉ Apple P12</h1>

    <form id="form">
      <div class="drop-zone" id="dropZone">Kéo & thả file .zip vào đây hoặc chọn tệp</div>
      <input type="file" id="zip" name="ZipFile" accept=".zip" hidden>

      <input type="text" id="pass" name="P12PassWordZip" placeholder="Nhập mật khẩu (nếu có)">
      <button type="submit">Kiểm tra</button>
    </form>

    <div id="result" class="result-card" style="display:none;"></div>

    <div class="actions" id="actions" style="display:none;">
      <a href="#" id="backBtn">Quay lại</a>
      <a href="https://cuios.shop" target="_blank" class="buy">Buy Cert</a>
    </div>
  </div>

<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) return alert('Vui lòng chọn file .zip');
  const pass = document.getElementById('pass').value;
  const formData = new FormData();
  formData.append('ZipFile', file);
  formData.append('P12PassWordZip', pass);

  const resEl = document.getElementById('result');
  resEl.style.display = 'block';
  resEl.innerHTML = '🔍 Đang kiểm tra...';

  const resp = await fetch('/api/check', { method: 'POST', body: formData });
  const data = await resp.json();

  if (!data.ok) {
    resEl.innerHTML = '❌ Lỗi: ' + (data.error || JSON.stringify(data));
    return;
  }

  // ✅ Tính ngày còn lại
  let daysLeftText = '-';
  if (data.expirationDate) {
    const expDate = new Date(data.expirationDate);
    const now = new Date();
    const diff = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
    if (!isNaN(diff)) {
      daysLeftText = diff >= 0 ? `${diff} ngày` : `${Math.abs(diff)} ngày trước`;
    }
  }

  // ✅ Mapping status + lời nhắn
  let statusClass = 'active';
  let statusText = 'Hoạt động';
  let note = '';

  if (data.status === 'revoked') {
    statusClass = 'revoked'; statusText = 'Đã thu hồi';
    note = `⚠️ Chứng chỉ đã bị thu hồi.<br>
    👉 UDID có khả năng bị **Blacklist**, hãy mua **gói Unband** để tiếp tục sử dụng.`;
  } else if (data.status === 'expired') {
    statusClass = 'revoked'; statusText = 'Đã hết hạn';
    note = `⏰ Chứng chỉ đã hết hạn, chỉ cần **mua mới** là có thể sử dụng lại ngay.`;
  } else if (data.status === 'valid') {
    statusClass = 'active'; statusText = 'Hoạt động';
    note = `✅ Chứng chỉ hoạt động bình thường, bạn có thể tiếp tục ký và dùng app.`;
  } else {
    note = `❓ Không xác định được trạng thái chứng chỉ.`;
  }

  resEl.innerHTML = `
    <p><b>Tên chứng chỉ:</b> ${data.certName || '-'}</p>
    <p><b>Ngày bắt đầu:</b> ${data.effectiveDate || '-'}</p>
    <p><b>Ngày hết hạn:</b> ${data.expirationDate || '-'}</p>
    <p><b>Ngày sử dụng còn:</b> ${daysLeftText}</p>
    <p><b>Trạng thái:</b> <span class="status ${statusClass}">${statusText}</span></p>
    <p><b>Loại:</b> Distribution có hỗ trợ App Group</p>
    <p class="note">${note}</p>
  `;

  document.getElementById('form').style.display = 'none';
  document.getElementById('actions').style.display = 'block';
});

</script>
</body>
</html>
