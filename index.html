<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P12 Apple | Kiểm tra đơn hàng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔍 Kiểm tra đơn hàng</h1>
    <p>Nhập UDID hoặc tải lên file chứng chỉ (.zip) để kiểm tra trạng thái đơn hàng</p>

    <input type="text" id="udid" placeholder="Nhập UDID hoặc mã PIN...">
    <div style="margin: 10px 0; color:#666;">— hoặc —</div>
    <input type="file" id="zipFile" accept=".zip">

    <button onclick="checkOrder()">Kiểm tra ngay</button>

    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
