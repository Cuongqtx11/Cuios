<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra chứng chỉ Apple P12</title>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    width: 90%;
    max-width: 400px;
    background: #1e293b;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.6s ease;
  }
  h2 {
    text-align: center;
    margin-bottom: 16px;
    color: #38bdf8;
  }
  .form-group {
    margin-bottom: 15px;
  }
  input[type="file"], input[type="text"] {
    width: 100%;
    padding: 10px;
    background: #334155;
    border: 1px solid #475569;
    color: #e2e8f0;
    border-radius: 6px;
  }
  input[type="file"]::file-selector-button {
    background: #38bdf8;
    border: none;
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  #checkBtn {
    background: #10b981;
    color: white;
  }
  #checkBtn:hover {
    background: #059669;
  }
  .result-box {
    display: none;
    text-align: left;
    animation: fadeIn 0.5s ease;
  }
  .result-line {
    margin: 8px 0;
    font-size: 15px;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-group button, .btn-group a {
    flex: 1;
    text-align: center;
    text-decoration: none;
  }
  .buy-btn {
    background: #38bdf8;
    color: white;
  }
  .buy-btn:hover {
    background: #0284c7;
  }
  .back-btn {
    background: #475569;
    color: #e2e8f0;
  }
  .back-btn:hover {
    background: #64748b;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container" id="formContainer">
  <h2>Kiểm tra chứng chỉ Apple P12</h2>
  <form id="checkForm">
    <div class="form-group">
      <input type="file" id="ZipFile" accept=".zip" required>
    </div>
    <div class="form-group">
      <input type="text" id="P12PassWordZip" placeholder="Nhập mật khẩu P12" required>
    </div>
    <button id="checkBtn" type="submit">Kiểm tra</button>
  </form>
  <p style="font-size:13px;text-align:center;margin-top:10px;color:#94a3b8;">
    Chỉ cần upload file .zip và mật khẩu. Kết quả sẽ hiển thị ngay.
  </p>
</div>

<!-- Kết quả -->
<div class="container result-box" id="resultBox">
  <h2>Kết Quả Kiểm Tra</h2>
  <div class="result-line"><b>Tên chứng chỉ:</b> <span id="certName">-</span></div>
  <div class="result-line"><b>Ngày hết hạn:</b> <span id="expDate">-</span></div>
  <div class="result-line"><b>Trạng thái:</b> <span id="status">-</span></div>
  <div class="result-line"><b>Còn lại:</b> <span id="daysLeft">-</span></div>
  <div class="result-line"><b>Loại:</b> Distribution có hỗ trợ App Group</div>

  <div class="btn-group">
    <button class="back-btn" onclick="location.reload()">↩️ Quay lại</button>
    <a href="https://cuios.shop" target="_blank">
      <button class="buy-btn">🛒 Buy Cert</button>
    </a>
  </div>
</div>

<script>
const form = document.getElementById('checkForm');
const resultBox = document.getElementById('resultBox');
const formContainer = document.getElementById('formContainer');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('ZipFile').files[0];
  const pass = document.getElementById('P12PassWordZip').value;
  if (!file || !pass) return alert('Vui lòng chọn file và nhập mật khẩu.');

  const formData = new FormData();
  formData.append('zip', file);
  formData.append('pass', pass);

  // Gọi API thực tế của bạn tại đây:
  const res = await fetch('https://check.p12apple.com/', { method: 'POST', body: formData });
  const data = await res.json();

  if (!data || !data.certname) {
    alert("Không nhận được dữ liệu hợp lệ từ server.");
    return;
  }

  // --- Hiển thị dữ liệu ---
  const expDate = new Date(data.exp);
  const now = new Date();
  const daysLeft = Math.max(0, Math.floor((expDate - now) / (1000 * 60 * 60 * 24)));
  let statusText = "";
  const low = data.status.toLowerCase();
  if (low.includes('revok')) statusText = "🔴 Đã thu hồi";
  else if (low.includes('valid') || low.includes('good') || low.includes('active')) statusText = "🟢 Hoạt động";
  else if (low.includes('expire')) statusText = "⚫ Đã hết hạn";
  else statusText = "⚪ Không xác định";

  document.getElementById('certName').textContent = data.certname;
  document.getElementById('expDate').textContent = expDate.toLocaleDateString('vi-VN');
  document.getElementById('status').textContent = statusText;
  document.getElementById('daysLeft').textContent = daysLeft + " ngày";

  // Ẩn form, hiện kết quả
  formContainer.style.display = 'none';
  resultBox.style.display = 'block';
});

// Cho phép kéo & thả file
document.body.addEventListener('dragover', (e) => e.preventDefault());
document.body.addEventListener('drop', (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('ZipFile');
  if (e.dataTransfer.files.length) fileInput.files = e.dataTransfer.files;
});
</script>
</body>
</html>
