<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('zip').files[0];
  const pass = document.getElementById('pass').value;
  const fd = new FormData();
  fd.append('ZipFile', file);
  fd.append('P12PassWordZip', pass);

  const resultEl = document.getElementById('result');
  resultEl.innerHTML = 'Đang kiểm tra...';

  try {
    const resp = await fetch('/api/check', { method: 'POST', body: fd });
    const data = await resp.json();

    if (!data.ok) {
      resultEl.innerHTML = `<pre>Lỗi: ${JSON.stringify(data, null, 2)}</pre>`;
      return;
    }

    // Tạo HTML hiển thị kết quả
    let statusClass = '';
    let emoji = '🟢';
    if (data.status?.toLowerCase().includes('revoked')) {
      statusClass = 'revoked';
      emoji = '🔴';
    }

    resultEl.innerHTML = `
      <div class="result ${statusClass}">
        <h3>Kết quả kiểm tra</h3>
        <p><b>CertName:</b> ${data.certName || '-'}</p>
        <p><b>Effective Date:</b> ${data.effectiveDate || '-'}</p>
        <p><b>Expiration Date:</b> ${data.expirationDate || '-'}</p>
        <p><b>Status:</b> ${emoji} ${data.status || '-'}</p>
      </div>
    `;
  } catch (err) {
    resultEl.innerHTML = `<pre>Lỗi kết nối: ${err.message}</pre>`;
  }
});
</script>

<style>
.result {
  border-radius: 8px;
  padding: 12px;
  margin-top: 16px;
  background: #eaffea;
  color: #055a00;
  border: 1px solid #55aa55;
}
.result.revoked {
  background: #ffe6e6;
  color: #a10000;
  border-color: #cc0000;
}
</style>
