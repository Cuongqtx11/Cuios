name: Daily Revenue Update

on:
  schedule:
    # Chạy workflow mỗi ngày lúc 2 AM UTC (ví dụ)
    # Bạn có thể điều chỉnh thời gian và múi giờ.
    # Để chạy lúc 7 AM giờ Việt Nam (GMT+7), bạn có thể đặt là '0 0 * * *' nếu múi giờ của runner là UTC+7
    # Hoặc tính toán lệch múi giờ. Ví dụ: 7 AM VN = 0 AM UTC.
    - cron: '55 * * * *'
  workflow_dispatch:
    # Cho phép bạn chạy workflow này thủ công từ GitHub UI

jobs:
  run_python_script:
    runs-on: ubuntu-latest # Chạy trên hệ điều hành Ubuntu mới nhất

    steps:
    - name: Checkout code # Bước 1: Lấy mã nguồn từ repository
      uses: actions/checkout@v4

    - name: Set up Python # Bước 2: Thiết lập môi trường Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # Đảm bảo phiên bản Python phù hợp với mã của bạn

    - name: Install dependencies # Bước 3: Cài đặt các thư viện cần thiết từ requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create credentials.json # Bước 4: Tạo file credentials.json từ GitHub Secret
      # Đây là bước quan trọng để script Python có thể xác thực với Google Sheets
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }} # Tham chiếu đến Secret đã tạo

    - name: Run Python script # Bước 5: Chạy file Python chính
      run: python main.py
      # Bạn có thể thêm biến môi trường ở đây nếu main.py cần
      # env:
      #   MY_CUSTOM_VAR: "some_value"
